name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # CUPS real solo en Linux. `file:///dev/null` exige FileDevice=yes (desactivado por defecto).
      # `usermod -aG lpadmin` no aplica en el shell actual, así que la prueba se ejecuta con sudo
      # (ver el paso "Prueba CUPS real" más abajo).
      - name: Instalar y arrancar CUPS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cups cups-client cups-bsd
          sudo systemctl start cups || sudo cupsd
          echo "FileDevice Yes" | sudo tee -a /etc/cups/cups-files.conf
          sudo systemctl restart cups || true
          timeout 30 sh -c 'until lpstat -r 2>/dev/null | grep -q "is running"; do sleep 1; done'
      # Lista de apps instaladas (macOS .app, Windows menú Inicio, Linux .desktop) de la app de escritorio.
      - name: Dependencias de la app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pruebas de la lista de apps
        run: cargo test -p control-impresion apps_tests -- --nocapture
      - name: Pruebas del núcleo (reglas, host, spooler en Windows)
        run: cargo test -p control-core -- --nocapture
      # Compila como usuario normal y ejecuta solo este binario con sudo (root administra CUPS);
      # así los archivos de target/ no quedan con dueño root. CUPS_E2E=1 activa la prueba.
      - name: Prueba CUPS real (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p control-core --test cups_linux --no-run
          sudo -E env "PATH=$PATH" CUPS_E2E=1 cargo test -p control-core --test cups_linux -- --nocapture
