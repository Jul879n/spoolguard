# SpoolGuard (modo servidor).
#
#   export CONTROL_ADMIN_PASSWORD='una-clave-larga'      # obligatoria (no hay contraseña por defecto)
#   export PRINTERS='Oficina=socket://192.168.1.50:9100'  # impresoras de red a controlar
#   docker compose up -d --build
#
# Panel:  http://127.0.0.1:8080  (solo desde el propio servidor por defecto). Para abrirlo a la red define
#         PANEL_BIND=0.0.0.0 (o la IP de una interfaz) y ponlo detrás de un proxy HTTPS: el panel habla HTTP plano.
# Cola IPP para los PC:  ipp://SERVIDOR:631/printers/Oficina  (escucha en todas las interfaces: es el servicio
#         que usan los PC; limítalo con IPP_BIND=<IP> o con el cortafuegos si solo debe verse en una red)
#
# Sin variable CONTROL_ADMIN_PASSWORD (docker run sin compose) el servidor genera una contraseña aleatoria
# y la imprime una sola vez en `docker logs`. Para no dejarla en `docker inspect` usa un archivo:
# CONTROL_ADMIN_PASSWORD_FILE=/run/secrets/admin_password (Docker secrets) en lugar de la variable.
#
# PRINTERS = "Nombre=uri;Nombre2=uri2". Cada entrada ejecuta al arrancar:
#   lpadmin -p NOMBRE -E -v spoolguard:socket://IP:9100 -m raw -o printer-is-shared=true
# También se puede hacer a mano: docker compose exec control lpadmin -p NOMBRE -E -v spoolguard:socket://IP:9100 -m raw
#
# IMPORTANTE: restringe la impresora a la IP de este servidor (filtro de IP de la impresora o firewall en 9100/515/631);
# si no, quien imprima directo a la impresora se salta el control.
services:
  control:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: control-impresion:latest
    init: true
    restart: unless-stopped
    ports:
      - "${IPP_BIND:-0.0.0.0}:631:631"      # IPP: los PC imprimen aquí
      - "${PANEL_BIND:-127.0.0.1}:8080:8080" # panel web: solo local por defecto (ver arriba)
    # El proceso ya corre como usuario «control» (uid 1000, ver docker/Dockerfile). cupsd también: no necesita
    # root ni capacidades. No se usa read_only: cupsd escribe en /etc/cups, /var/spool/cups y /run/cups.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:?define CONTROL_ADMIN_PASSWORD (no hay contraseña por defecto)}
      PRINTERS: ${PRINTERS:-}
      # CONTROL_RELEASE_ON_EXIT: "1"   # liberar las colas al detener (por defecto quedan retenidas)
      # CONTROL_TRUST_PROXY: "1"       # usar X-Forwarded-For. Con esto NO publiques el 8080: usa "127.0.0.1:8080:8080" o solo la red del proxy
    volumes:
      - control-data:/data # config.json, log.jsonl, managed.json, quick.json
volumes:
  control-data:
