# CUPS mínimo para SpoolGuard. Los registros van a stderr (docker logs).
LogLevel warn
MaxLogSize 0
Listen *:631
Listen /run/cups/cups.sock
# Sin descubrimiento automático ni interfaz web.
Browsing Off
BrowseLocalProtocols none
WebInterface No
DefaultShared Yes
ServerAlias *
PreserveJobHistory No
DefaultAuthType Basic

<Location />
  Order allow,deny
  Allow all
</Location>

# La administración solo desde el propio contenedor.
<Location /admin>
  Order allow,deny
  Allow 127.0.0.1
  Allow ::1
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow 127.0.0.1
</Location>

# Política: imprimir está abierto; retener, liberar, reiniciar y administrar exigen @SYSTEM (grupo lpadmin).
# Así un cliente no puede liberar con `lp -H resume` un trabajo retenido por el control.
<Policy default>
  # control-server necesita leer nombre, usuario y origen de cada trabajo (con la política por defecto CUPS los oculta).
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job>
    Order deny,allow
  </Limit>

  <Limit Cancel-Subscription Create-Job-Subscription Renew-Subscription Get-Notifications>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Hold-Job Release-Job Restart-Job Resume-Job Set-Job-Attributes Reprocess-Job Cancel-Current-Job Suspend-Current-Job Promote-Job Schedule-Job-After CUPS-Move-Job>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Purge-Jobs Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs Set-Printer-Attributes>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job Cancel-My-Jobs CUPS-Authenticate-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
