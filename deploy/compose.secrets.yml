# SpoolGuard con la contraseña de administrador en un archivo (Docker secrets): no queda en `docker inspect`.
#
#   printf '%s' 'una-clave-larga' > admin_password.txt && chmod 600 admin_password.txt
#   docker compose -f compose.secrets.yml up -d
services:
  control:
    image: ghcr.io/jul879n/spoolguard:${SPOOLGUARD_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${IPP_BIND:-0.0.0.0}:631:631"
      - "${PANEL_BIND:-127.0.0.1}:8080:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      CONTROL_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      PRINTERS: ${PRINTERS:-}
      SPOOLGUARD_VERDICT_TIMEOUT: ${SPOOLGUARD_VERDICT_TIMEOUT:-}   # protección previa: segundos de espera (1-600, defecto 10)
      SPOOLGUARD_STRICT: ${SPOOLGUARD_STRICT:-}   # 1 = estricto: sin veredicto a tiempo no se imprime (defecto 0)
    secrets:
      - admin_password
    volumes:
      - control-data:/data
secrets:
  admin_password:
    file: ./admin_password.txt
volumes:
  control-data:
